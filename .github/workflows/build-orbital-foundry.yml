name: Build Orbital Foundry APK

on:
  push:
    branches: [ main, orbital-foundry-v1, orbital-foundry-graphics-stage3, orbital-foundry-sfs-interface-v04, orbital-foundry-sfs-rebuild-v0-5 ]
  workflow_dispatch:

concurrency:
  group: orbital-foundry-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run flight physics tests
        run: gradle --no-daemon -p orbital-foundry :app:testDebugUnitTest
      - name: Download freely usable planet texture maps
        run: |
          mkdir -p orbital-foundry/app/src/main/assets/textures
          curl --fail --location --silent --show-error --retry 3 https://svs.gsfc.nasa.gov/vis/a000000/a002900/a002915/bluemarble-2048.png --output orbital-foundry/app/src/main/assets/textures/earth.png
          curl --fail --location --silent --show-error --retry 3 https://space.jpl.nasa.gov/tmaps/pix/mar0kuu2.jpg --output orbital-foundry/app/src/main/assets/textures/mars.jpg
          test -s orbital-foundry/app/src/main/assets/textures/earth.png
          test -s orbital-foundry/app/src/main/assets/textures/mars.jpg
      - name: Build debug APK
        run: gradle --no-daemon -p orbital-foundry :app:assembleDebug
      - name: Verify APK
        run: |
          test -s orbital-foundry/app/build/outputs/apk/debug/app-debug.apk
          ls -lh orbital-foundry/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbital-foundry-debug
          path: orbital-foundry/app/build/outputs/apk/debug/app-debug.apk
