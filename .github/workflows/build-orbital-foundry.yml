name: Build Orbital Foundry APK

on:
  push:
    branches: [ main, orbital-foundry-v1 ]
  workflow_dispatch:

concurrency:
  group: orbital-foundry-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon -p orbital-foundry :app:assembleDebug
      - name: Verify APK
        run: |
          test -s orbital-foundry/app/build/outputs/apk/debug/app-debug.apk
          ls -lh orbital-foundry/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbital-foundry-debug
          path: orbital-foundry/app/build/outputs/apk/debug/app-debug.apk
