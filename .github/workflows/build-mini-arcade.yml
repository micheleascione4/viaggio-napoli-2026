name: Build 20X Mini Arcade APK

on:
  push:
    branches: [ main, mini-arcade-v1 ]
  workflow_dispatch:

concurrency:
  group: mini-arcade-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon -p mini-arcade :app:assembleDebug
      - name: Verify APK
        run: |
          test -s mini-arcade/app/build/outputs/apk/debug/app-debug.apk
          ls -lh mini-arcade/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 20x-mini-arcade-debug
          path: mini-arcade/app/build/outputs/apk/debug/app-debug.apk
