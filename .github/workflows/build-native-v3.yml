name: Build native Android APK

on:
  workflow_dispatch:
  push:
    branches: [native-v3-compose]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Native APK smoke test
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt2 | sort -V | tail -1)"
          test -n "$AAPT2"
          "$AAPT2" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.example.viaggionapoli'" /tmp/badging.txt
          grep -q "launchable-activity" /tmp/badging.txt
          if unzip -l "$APK" | grep -Eq '(^|/)index\.html$|android_asset'; then
            echo "ERROR: legacy WebView/HTML asset detected in native APK"
            exit 1
          fi
          echo "Native APK smoke test passed."
      - uses: actions/upload-artifact@v4
        with:
          name: viaggio-napoli-v3-debug
          path: app/build/outputs/apk/debug/*.apk
